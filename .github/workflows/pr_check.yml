name: pr

on:
  pull_request:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: сheckout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fvm setup
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> $GITHUB_PATH

      - name: dependencies install
        run: |
          fvm use
          fvm flutter pub get
          fvm dart run melos bs

      - name: resolve diff range
        id: diff
        run: echo "value=${{ github.event.pull_request.base.sha }}...HEAD" >> "$GITHUB_OUTPUT"

      - name: format
        run: |
          fvm dart run melos exec \
            --diff "${{ steps.diff.outputs.value }}" \
            --concurrency=1 \
            -- "dart format --set-exit-if-changed ."

      - name: analyze
        run: |
          fvm dart run melos exec \
            --diff "${{ steps.diff.outputs.value }}" \
            --concurrency=1 \
            -- "flutter analyze ."

      - name: test
        run: |
          fvm dart run melos exec \
            --diff "${{ steps.diff.outputs.value }}" \
            --concurrency=1 \
            --dir-exists="test" \
            -- "flutter test"
